name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v5

      - name: Install unixODBC dev headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes unixodbc-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Se captura la salida de clippy en un log y se publica en el step
      # summary del job (visible via la API de check-runs, sin admin) para
      # poder leer los errores exactos desde el pipeline de diagnostico.
      # El gate explicito al final hace que el job siga fallando como antes.
      - name: cargo fmt + clippy (captura de errores)
        id: lint
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo fmt --check || true
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.log
          cargo fmt --check

      - name: Publicar salida de clippy al summary
        if: always()
        shell: bash
        run: |
          {
            echo "### cargo fmt/clippy"
            echo '```'
            tail -c 60000 /tmp/clippy.log 2>/dev/null || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate -- lint
        if: steps.lint.outcome == 'failure'
        run: exit 1

      # Invariante de AGENTS.md ss4: el GIL nunca se sostiene en el hilo
      # bloqueante. Todo `Python::` en src/core/ (el FFI unsafe) es una
      # violacion de esa regla -- esto lo hace mecanico en vez de confiar
      # en revisiones manuales.
      - name: Lint mecanico -- src/core/ nunca debe tocar el GIL
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if grep -rn "Python::" src/core/ 2>/dev/null; then
            echo "::error::src/core/ no debe referenciar Python:: (GIL) -- ver AGENTS.md ss4"
            exit 1
          fi

  build:
    name: build + smoke import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v5

      - name: Install unixODBC dev headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes unixodbc-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: cargo check --all-targets --all-features (captura de errores)
        id: check
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --all-targets --all-features 2>&1 | tee /tmp/check.log

      - name: Publicar salida de cargo check al summary
        if: always()
        shell: bash
        run: |
          {
            echo "### cargo check"
            echo '```'
            tail -c 60000 /tmp/check.log 2>/dev/null || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate -- check
        if: steps.check.outcome == 'failure'
        run: exit 1

      - name: pip install maturin
        run: python -m pip install --upgrade pip "maturin>=1.7,<2.0"

      - name: maturin develop --release
        run: maturin develop --release

      - name: Smoke import
        run: python -c "import rustodbc; print(rustodbc.__version__)"

      # No hay job de integracion contra un IBM i real: requiere un
      # sistema DB2 for i accesible, que no existe en runners de GitHub.
      # Ver AGENTS.md ss9 "No hay integracion de CI".