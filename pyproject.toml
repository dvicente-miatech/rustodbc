[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# Nombre de la distribucion en PyPI. El import en Python sigue siendo
# `rustodbc` (ver [tool.maturin] module-name) -- el paquete PyPI se llama
# rustodbc-mi y el trusted publisher de pypi.org esta registrado para ese
# nombre exacto; si no coinciden, PyPI rechaza el upload (400).
name = "rustodbc-mi"
version = "0.3.0"
description = "Async ODBC engine for IBM DB2 for i (iSeries), written in Rust"
requires-python = ">=3.12"
license = { text = "MIT-0" }
readme = "README.md"
# Deliberate: zero Python runtime dependencies. See AGENTS.md ss1.
dependencies = []

[project.optional-dependencies]
arrow = []  # documents the cargo "arrow" feature; the wheel itself differs, see AGENTS.md

[tool.maturin]
module-name = "rustodbc._rustodbc"
python-source = "python"
features = ["pyo3/extension-module"]
